<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บัญชีของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#1c2b2f;
    --paper:#f5f0e1;
    --paper-alt:#efe6cd;
    --green:#2f6f4f;
    --green-soft:#e3ede6;
    --red:#9c3b3b;
    --red-soft:#f3e5e2;
    --brass:#b08d57;
    --line: rgba(28,43,47,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Thai', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:720px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  h1,h2,h3{ font-family:'Noto Serif Thai', serif; margin:0; }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
    margin-bottom:20px;
  }
  .header h1{ font-size:1.5rem; }
  .header .sub{ font-size:0.78rem; color:var(--brass); letter-spacing:0.05em; margin-top:4px;}
  .balance-block{ text-align:right; }
  .balance-label{ font-size:0.72rem; color:var(--ink); opacity:0.6; }
  .balance-num{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:1.9rem;
    line-height:1.1;
  }
  .balance-num.neg{ color:var(--red); }
  .balance-num.pos{ color:var(--green); }

  .tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 0;
    border:1px solid var(--ink);
    border-bottom:none;
    border-radius:6px 6px 0 0;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    background:var(--paper-alt);
    opacity:0.55;
  }
  .tab.active[data-type="income"]{ background:var(--green-soft); border-color:var(--green); color:var(--green); opacity:1; }
  .tab.active[data-type="expense"]{ background:var(--red-soft); border-color:var(--red); color:var(--red); opacity:1; }

  .card{
    background:var(--paper-alt);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:18px;
  }
  label{ font-size:0.78rem; font-weight:600; display:block; margin-bottom:5px; opacity:0.8; }
  input, select, textarea{
    width:100%;
    font-family:'Noto Sans Thai', sans-serif;
    font-size:0.95rem;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
    margin-bottom:12px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button{
    font-family:'Noto Sans Thai', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    border:none;
    border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
  }
  .btn-add{ width:100%; background:var(--ink); color:var(--paper); }
  .btn-add[data-type="income"]{ background:var(--green); }
  .btn-add[data-type="expense"]{ background:var(--red); }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
  }
  .charts{ display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:18px; }
  @media(min-width:600px){ .charts{ grid-template-columns:1fr 1fr; } }
  .chart-card canvas{ max-height:220px; }
  .chart-card h3{ font-size:0.95rem; margin-bottom:10px; }

  .section-title{
    font-size:1rem;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .filter-row{ display:flex; gap:8px; margin-bottom:10px; }
  .filter-row select{ margin-bottom:0; }

  table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  th{
    text-align:left;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    opacity:0.6;
    padding:6px 4px;
    border-bottom:2px solid var(--ink);
  }
  td{
    padding:9px 4px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  .amt{ font-family:'IBM Plex Mono', monospace; font-weight:600; white-space:nowrap; text-align:right; }
  .amt.income{ color:var(--green); }
  .amt.expense{ color:var(--red); }
  .cat-tag{ font-size:0.78rem; opacity:0.85; }
  .note{ font-size:0.72rem; opacity:0.55; display:block; margin-top:2px; }
  .empty{ text-align:center; padding:30px 0; opacity:0.5; font-size:0.85rem; }
  .del-btn{ background:none; border:none; color:var(--red); font-size:0.8rem; padding:2px 6px; cursor:pointer; opacity:0.6;}
  .del-btn:hover{ opacity:1; }

  .report-modal{
    position:fixed; inset:0; background:rgba(28,43,47,0.5);
    display:none; align-items:center; justify-content:center; padding:16px; z-index:50;
  }
  .report-modal.show{ display:flex; }
  .report-box{
    background:var(--paper); border-radius:10px; max-width:420px; width:100%;
    max-height:85vh; overflow-y:auto; padding:20px; border:1px solid var(--ink);
  }
  .report-box h2{ font-size:1.15rem; margin-bottom:2px; }
  .report-box .report-month{ font-size:0.8rem; color:var(--brass); margin-bottom:14px; display:block;}
  .report-line{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:0.88rem; }
  .report-total{ font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .report-actions{ display:flex; gap:8px; margin-top:16px; }
  .report-actions button{ flex:1; }
  .close-x{ float:right; background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--ink); }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div>
      <h1>บัญชีของฉัน</h1>
      <div class="sub">รายรับ · รายจ่าย · เรียลไทม์</div>
    </div>
    <div class="balance-block">
      <div class="balance-label">ยอดคงเหลือ</div>
      <div class="balance-num" id="balanceNum">฿0</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-type="income" onclick="switchTab('income')">+ รายรับ</div>
    <div class="tab" data-type="expense" onclick="switchTab('expense')">+ รายจ่าย</div>
  </div>

  <div class="card">
    <label>จำนวนเงิน (บาท)</label>
    <input type="number" id="amountInput" placeholder="0.00" min="0" step="0.01">
    <div class="row2">
      <div>
        <label>วันที่</label>
        <input type="date" id="dateInput">
      </div>
      <div>
        <label>หมวดหมู่</label>
        <select id="categoryInput" onchange="onCategoryChange()"></select>
      </div>
    </div>
    <div id="detailWrap" style="display:none;">
      <label>รายละเอียดเพิ่มเติม</label>
      <textarea id="detailInput" rows="2" placeholder="ระบุรายละเอียด..."></textarea>
    </div>
    <button class="btn-add" id="addBtn" data-type="income" onclick="addTransaction()">บันทึกรายรับ</button>
  </div>

  <div class="charts">
    <div class="card chart-card">
      <h3>รายจ่ายตามหมวดหมู่</h3>
      <canvas id="pieChart"></canvas>
    </div>
    <div class="card chart-card">
      <h3>แนวโน้มรายวัน</h3>
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <span>รายการทั้งหมด</span>
      <button class="btn-ghost" onclick="openReport()">ออกรายงานประจำเดือน</button>
    </div>
    <div class="filter-row">
      <select id="monthFilter" onchange="render()"></select>
      <select id="typeFilter" onchange="render()">
        <option value="all">ทั้งหมด</option>
        <option value="income">รายรับ</option>
        <option value="expense">รายจ่าย</option>
      </select>
    </div>
    <table>
      <thead><tr><th>วันที่</th><th>หมวดหมู่</th><th style="text-align:right;">จำนวนเงิน</th><th></th></tr></thead>
      <tbody id="txBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">ยังไม่มีรายการ เริ่มบันทึกได้เลย</div>
  </div>

</div>

<div class="report-modal" id="reportModal">
  <div class="report-box">
    <button class="close-x" onclick="closeReport()">✕</button>
    <h2>รายงานประจำเดือน</h2>
    <select id="reportMonthSelect" onchange="renderReport()" style="margin-bottom:14px;"></select>
    <div id="reportBody"></div>
    <div class="report-actions">
      <button class="btn-ghost" onclick="exportCSV()">ดาวน์โหลด CSV</button>
      <button class="btn-add" style="background:var(--ink);" onclick="closeReport()">ปิด</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fsuvhwpjgyuhxgsqcwzw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzdXZod3BqZ3l1aHhnc3Fjd3p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDcwNzgsImV4cCI6MjEwMzMyMzA3OH0.IjkTkHG1Gb4g503x-FpC8jCUmYkNXIw0Zi4pL6agi1c';
const REST_URL = `${SUPABASE_URL}/rest/v1/transactions`;
const SB_HEADERS = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

const CATS = {
  income: [
    {v:'yuehua_income', l:'💰 รายได้จาก YUEHUA'},
    {v:'other_income', l:'💵 อื่นๆ'}
  ],
  expense: [
    {v:'food', l:'🍽️ อาหาร'},
    {v:'transport', l:'🚗 เดินทาง/น้ำมัน'},
    {v:'housing', l:'🏠 ที่พัก/ค่าเช่า/ค่าน้ำค่าไฟ'},
    {v:'education', l:'📚 การศึกษา/หนังสือ/คอร์สเรียน'},
    {v:'business', l:'💼 ธุรกิจ/YUEHUA'},
    {v:'shopping', l:'🛍️ ช้อปปิ้ง/ของใช้ส่วนตัว'},
    {v:'entertainment', l:'🎮 บันเทิง/สังสรรค์'},
    {v:'health', l:'💊 สุขภาพ'},
    {v:'bills', l:'📱 บิล/สาธารณูปโภค'},
    {v:'other_expense', l:'❓ อื่นๆ'}
  ]
};
const OTHER_CATS = ['other_expense'];

let currentType = 'income';
let transactions = [];
let pieChart, trendChart;

function catLabel(type, val){
  const found = CATS[type].find(c=>c.v===val);
  return found ? found.l : val;
}

function switchTab(type){
  currentType = type;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.type===type));
  const addBtn = document.getElementById('addBtn');
  addBtn.dataset.type = type;
  addBtn.textContent = type==='income' ? 'บันทึกรายรับ' : 'บันทึกรายจ่าย';
  populateCategorySelect();
}

function populateCategorySelect(){
  const sel = document.getElementById('categoryInput');
  sel.innerHTML = CATS[currentType].map(c=>`<option value="${c.v}">${c.l}</option>`).join('');
  onCategoryChange();
}

function onCategoryChange(){
  const val = document.getElementById('categoryInput').value;
  document.getElementById('detailWrap').style.display = OTHER_CATS.includes(val) ? 'block' : 'none';
}

async function addTransaction(){
  const amount = parseFloat(document.getElementById('amountInput').value);
  const date = document.getElementById('dateInput').value || new Date().toISOString().slice(0,10);
  const category = document.getElementById('categoryInput').value;
  const detail = document.getElementById('detailInput').value.trim();
  if(!amount || amount<=0){ alert('กรุณาใส่จำนวนเงินให้ถูกต้อง'); return; }

  const addBtn = document.getElementById('addBtn');
  addBtn.disabled = true;
  try{
    const res = await fetch(REST_URL, {
      method: 'POST',
      headers: { ...SB_HEADERS, Prefer: 'return=representation' },
      body: JSON.stringify([{
        type: currentType,
        amount,
        tx_date: date,
        category,
        detail: OTHER_CATS.includes(category) ? detail : null
      }])
    });
    if(!res.ok) throw new Error(await res.text());
    const [row] = await res.json();
    transactions.push({ id: row.id, type: row.type, amount: parseFloat(row.amount), date: row.tx_date, category: row.category, detail: row.detail||'' });
    document.getElementById('amountInput').value = '';
    document.getElementById('detailInput').value = '';
    render();
  }catch(err){
    alert('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง (' + err.message + ')');
  }finally{
    addBtn.disabled = false;
  }
}

async function deleteTx(id){
  try{
    const res = await fetch(`${REST_URL}?id=eq.${id}`, { method:'DELETE', headers: SB_HEADERS });
    if(!res.ok) throw new Error(await res.text());
    transactions = transactions.filter(t=>t.id!==id);
    render();
  }catch(err){
    alert('ลบไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

async function loadTransactions(){
  try{
    const res = await fetch(`${REST_URL}?select=*&order=tx_date.desc`, { headers: SB_HEADERS });
    if(!res.ok) throw new Error(await res.text());
    const data = await res.json();
    transactions = data.map(r=>({ id:r.id, type:r.type, amount:parseFloat(r.amount), date:r.tx_date, category:r.category, detail:r.detail||'' }));
  }catch(err){
    console.error(err);
    document.getElementById('emptyMsg').textContent = 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง';
  }
  render();
}

function getMonthKey(dateStr){ return dateStr.slice(0,7); }

function populateMonthFilters(){
  const months = [...new Set(transactions.map(t=>getMonthKey(t.date)))].sort().reverse();
  const monthFilter = document.getElementById('monthFilter');
  const reportSelect = document.getElementById('reportMonthSelect');
  const prevFilterVal = monthFilter.value;
  const prevReportVal = reportSelect.value;

  const opts = ['<option value="all">ทุกเดือน</option>'].concat(
    months.map(m=>`<option value="${m}">${formatMonthLabel(m)}</option>`)
  ).join('');
  monthFilter.innerHTML = opts;
  reportSelect.innerHTML = months.length
    ? months.map(m=>`<option value="${m}">${formatMonthLabel(m)}</option>`).join('')
    : '<option value="">ไม่มีข้อมูล</option>';

  if(months.includes(prevFilterVal) || prevFilterVal==='all') monthFilter.value = prevFilterVal;
  if(months.includes(prevReportVal)) reportSelect.value = prevReportVal;
}

function formatMonthLabel(monthKey){
  const [y,m] = monthKey.split('-');
  const names = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  return `${names[parseInt(m,10)]} ${parseInt(y,10)+543}`;
}

function render(){
  populateMonthFilters();

  const monthFilter = document.getElementById('monthFilter').value;
  const typeFilter = document.getElementById('typeFilter').value;

  let filtered = transactions.filter(t=>{
    const monthOk = monthFilter==='all' || getMonthKey(t.date)===monthFilter;
    const typeOk = typeFilter==='all' || t.type===typeFilter;
    return monthOk && typeOk;
  }).sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);

  const tbody = document.getElementById('txBody');
  document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  tbody.innerHTML = filtered.map(t=>`
    <tr>
      <td>${t.date}</td>
      <td><span class="cat-tag">${catLabel(t.type, t.category)}</span>${t.detail ? `<span class="note">${escapeHtml(t.detail)}</span>` : ''}</td>
      <td class="amt ${t.type}">${t.type==='income'?'+':'-'}฿${t.amount.toLocaleString('th-TH',{minimumFractionDigits:2})}</td>
      <td><button class="del-btn" onclick="deleteTx(${t.id})">ลบ</button></td>
    </tr>
  `).join('');

  const totalIncome = transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const totalExpense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = totalIncome - totalExpense;
  const balEl = document.getElementById('balanceNum');
  balEl.textContent = `${balance<0?'-':''}฿${Math.abs(balance).toLocaleString('th-TH',{minimumFractionDigits:2})}`;
  balEl.className = 'balance-num ' + (balance<0?'neg':'pos');

  updateCharts();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function updateCharts(){
  const expenseByCat = {};
  transactions.filter(t=>t.type==='expense').forEach(t=>{
    expenseByCat[t.category] = (expenseByCat[t.category]||0) + t.amount;
  });
  const pieLabels = Object.keys(expenseByCat).map(k=>catLabel('expense', k));
  const pieData = Object.values(expenseByCat);

  const pieCtx = document.getElementById('pieChart').getContext('2d');
  if(pieChart) pieChart.destroy();
  pieChart = new Chart(pieCtx, {
    type:'doughnut',
    data:{ labels: pieLabels.length?pieLabels:['ยังไม่มีรายจ่าย'], datasets:[{
      data: pieData.length?pieData:[1],
      backgroundColor: pieData.length ? ['#9c3b3b','#b08d57','#2f6f4f','#1c2b2f','#c97b63','#6f8f7f','#8f6f3b','#4f6f9c','#7a4f9c','#3b8f8f'] : ['#e5ddc4'],
      borderWidth:0
    }]},
    options:{ plugins:{ legend:{ position:'bottom', labels:{ font:{ family:"'Noto Sans Thai'", size:10 }, boxWidth:10 } } }, maintainAspectRatio:true }
  });

  const dailyMap = {};
  transactions.forEach(t=>{
    if(!dailyMap[t.date]) dailyMap[t.date] = {income:0, expense:0};
    dailyMap[t.date][t.type] += t.amount;
  });
  const days = Object.keys(dailyMap).sort();
  const trendCtx = document.getElementById('trendChart').getContext('2d');
  if(trendChart) trendChart.destroy();
  trendChart = new Chart(trendCtx, {
    type:'line',
    data:{ labels: days, datasets:[
      { label:'รายรับ', data: days.map(d=>dailyMap[d].income), borderColor:'#2f6f4f', backgroundColor:'transparent', tension:0.25 },
      { label:'รายจ่าย', data: days.map(d=>dailyMap[d].expense), borderColor:'#9c3b3b', backgroundColor:'transparent', tension:0.25 }
    ]},
    options:{ plugins:{ legend:{ position:'bottom', labels:{ font:{ family:"'Noto Sans Thai'", size:10 }, boxWidth:10 } } }, scales:{ x:{ ticks:{ font:{ size:9 } } }, y:{ ticks:{ font:{ size:9 } } } }, maintainAspectRatio:true }
  });
}

function openReport(){
  document.getElementById('reportModal').classList.add('show');
  renderReport();
}
function closeReport(){
  document.getElementById('reportModal').classList.remove('show');
}

function renderReport(){
  const monthKey = document.getElementById('reportMonthSelect').value;
  const box = document.getElementById('reportBody');
  document.querySelector('.report-month')?.remove();
  const label = document.createElement('span');
  label.className = 'report-month';
  label.textContent = monthKey ? formatMonthLabel(monthKey) : '';
  document.getElementById('reportMonthSelect').insertAdjacentElement('afterend', label);

  if(!monthKey){ box.innerHTML = '<div class="empty">ไม่มีข้อมูลในเดือนนี้</div>'; return; }

  const monthTx = transactions.filter(t=>getMonthKey(t.date)===monthKey);
  const income = monthTx.filter(t=>t.type==='income');
  const expense = monthTx.filter(t=>t.type==='expense');
  const totalIncome = income.reduce((s,t)=>s+t.amount,0);
  const totalExpense = expense.reduce((s,t)=>s+t.amount,0);

  const byCat = {};
  expense.forEach(t=>{ byCat[t.category] = (byCat[t.category]||0)+t.amount; });

  let html = `
    <div class="report-line"><span>รายรับรวม</span><span class="report-total" style="color:var(--green);">+฿${totalIncome.toLocaleString('th-TH',{minimumFractionDigits:2})}</span></div>
    <div class="report-line"><span>รายจ่ายรวม</span><span class="report-total" style="color:var(--red);">-฿${totalExpense.toLocaleString('th-TH',{minimumFractionDigits:2})}</span></div>
    <div class="report-line"><span><b>คงเหลือสุทธิ</b></span><span class="report-total"><b>฿${(totalIncome-totalExpense).toLocaleString('th-TH',{minimumFractionDigits:2})}</b></span></div>
    <div style="margin-top:14px; font-size:0.8rem; opacity:0.6; font-weight:600;">แยกตามหมวดรายจ่าย</div>
  `;
  Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>{
    html += `<div class="report-line"><span>${catLabel('expense',cat)}</span><span class="report-total">฿${amt.toLocaleString('th-TH',{minimumFractionDigits:2})}</span></div>`;
  });
  box.innerHTML = html;
}

function exportCSV(){
  const monthKey = document.getElementById('reportMonthSelect').value;
  if(!monthKey) return;
  const monthTx = transactions.filter(t=>getMonthKey(t.date)===monthKey);
  let csv = 'วันที่,ประเภท,หมวดหมู่,จำนวนเงิน,รายละเอียด\n';
  monthTx.sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    csv += `${t.date},${t.type==='income'?'รายรับ':'รายจ่าย'},${catLabel(t.type,t.category)},${t.amount},${(t.detail||'').replace(/,/g,' ')}\n`;
  });
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `รายงาน_${monthKey}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);
populateCategorySelect();
loadTransactions();
</script>
